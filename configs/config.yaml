# Multimodal Breast Cancer Classification Configuration

# Data configuration
data:
  dataset_dir: "BCMID"
  manifest_path: "outputs/dataset_manifest.json"
  splits_path: "outputs/splits.json"
  image_size: [224, 224]
  num_workers: 0
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  seed: 42

# Training configuration
training:
  batch_size: 4
  grad_accum_steps: 2
  num_epochs: 15
  learning_rate: 1.0e-4
  backbone_lr: 1.0e-5
  weight_decay: 1.0e-4
  dropout: 0.3
  early_stopping_patience: 5
  freeze_backbones: true
  unfreeze_epoch: 5
  use_amp: false           # Set to false for full FP32 numerical stability on all GPUs
  use_class_weights: true  # Counteract ~5:1 class imbalance
  save_best_metric: "roc_auc"
  device: "auto"           # "cuda", "cpu", or "auto"
  seed: 42

# Model architecture configuration
model:
  # Standalone Backbones
  densenet_pretrained: true
  resnet_pretrained: true
  
  # Feature dimensions
  mammo_feature_dim: 1024   # DenseNet-121 feature embedding dimension
  us_feature_dim: 2048      # ResNet-50 feature embedding dimension
  hidden_dim: 256           # Shared projection dimension for graph and transformer
  
  # Learnable Attention Pooling
  pooling_hidden_dim: 128
  
  # Graph Attention Network (GATv2)
  gat_heads: 4
  gat_layers: 2
  gat_dropout: 0.2
  
  # Graph-Infused Transformer
  transformer_heads: 4
  transformer_layers: 2
  transformer_dim_feedforward: 512
  transformer_dropout: 0.2
  
  # Classification head
  num_classes: 2

# Output & Logging configuration
output:
  base_dir: "outputs/experiments"
  save_checkpoints: true
  save_plots: true
